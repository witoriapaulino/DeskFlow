openapi: 3.0.0
paths:
  /auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
      summary: RF02 — Login (retorna token JWT)
      tags:
        - Autenticação
  /auth/registrar:
    post:
      operationId: AuthController_registrar
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarDto'
      responses:
        '201':
          description: ''
      summary: RF02 — Autocadastro de usuário (perfil USUARIO)
      tags:
        - Autenticação
  /auth/perfil:
    get:
      operationId: AuthController_perfil
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: RF02 — Dados do usuário logado
      tags:
        - Autenticação
  /chamados:
    post:
      operationId: ChamadosController_criar
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarChamadoDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: RF01 — Abrir chamado
      tags:
        - Chamados
    get:
      operationId: ChamadosController_listar
      parameters:
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - ABERTO
              - EM_ATENDIMENTO
              - RESOLVIDO
              - FECHADO
        - name: tecnicoId
          required: false
          in: query
          schema:
            type: number
        - name: slaVencido
          required: false
          in: query
          description: true = só chamados com SLA vencido
          schema:
            type: boolean
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 'RF01 — Listar chamados (filtros: status, técnico, SLA vencido)'
      tags:
        - Chamados
  /chamados/{id}:
    get:
      operationId: ChamadosController_buscar
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: RF01 — Consultar chamado
      tags:
        - Chamados
  /chamados/{id}/status:
    patch:
      operationId: ChamadosController_atualizarStatus
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarStatusDto'
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: RF01 — Atualizar status do chamado
      tags:
        - Chamados
  /chamados/{id}/atribuicao:
    patch:
      operationId: ChamadosController_atribuir
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtribuirChamadoDto'
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: RF03 — Atribuir técnico, prioridade e SLA (gestor ou técnico)
      tags:
        - Chamados
  /chamados/{id}/solucao:
    post:
      operationId: ConhecimentoController_registrarSolucao
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarSolucaoDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: RF04 — Registrar solução e resolver o chamado (técnico atribuído)
      tags:
        - Solução e Base de Conhecimento
  /base-conhecimento:
    get:
      operationId: ConhecimentoController_buscarArtigos
      parameters:
        - name: busca
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: RF04 — Buscar artigos da base de conhecimento
      tags:
        - Solução e Base de Conhecimento
  /base-conhecimento/{id}:
    get:
      operationId: ConhecimentoController_buscarArtigo
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: RF04 — Consultar artigo
      tags:
        - Solução e Base de Conhecimento
  /relatorios/resumo:
    get:
      operationId: RelatoriosController_resumo
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: RF05 — Painel de atendimento (status, técnicos e SLA) — só GESTOR
      tags:
        - Relatórios
info:
  title: DeskFlow API
  description: Central de Serviços de TI — Projeto Integrador de Gerência de Configuração (Fametro)
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: usuario@deskflow.dev
        senha:
          type: string
          example: Senha@123
      required:
        - email
        - senha
    RegistrarDto:
      type: object
      properties:
        nome:
          type: string
          example: Maria Souza
        email:
          type: string
          example: maria@empresa.com
        senha:
          type: string
          example: Senha@123
          description: Mínimo 8 caracteres, com letra e número (RNF02)
      required:
        - nome
        - email
        - senha
    CriarChamadoDto:
      type: object
      properties:
        titulo:
          type: string
          example: Impressora do 2º andar não imprime
        descricao:
          type: string
          example: Desde hoje cedo a impressora mostra erro de papel atolado.
        prioridade:
          type: string
          enum:
            - BAIXA
            - MEDIA
            - ALTA
            - CRITICA
          default: MEDIA
      required:
        - titulo
        - descricao
    AtualizarStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ABERTO
            - EM_ATENDIMENTO
            - RESOLVIDO
            - FECHADO
          example: FECHADO
      required:
        - status
    AtribuirChamadoDto:
      type: object
      properties:
        tecnicoId:
          type: number
          example: 2
          description: Técnico responsável
        prioridade:
          type: string
          enum:
            - BAIXA
            - MEDIA
            - ALTA
            - CRITICA
          description: Se informada, recalcula o prazo de SLA
      required:
        - tecnicoId
    RegistrarSolucaoDto:
      type: object
      properties:
        descricao:
          type: string
          example: Removido o papel atolado e limpo o rolo de tração.
        publicarNaBase:
          type: boolean
          default: false
          description: Publicar a solução na base de conhecimento
        tituloArtigo:
          type: string
          example: Como resolver papel atolado na impressora
      required:
        - descricao
